<svg style="color-scheme:dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    :not(svg):has(> title) {
      cursor: help
    }
  </style>
  <title>Two-servo pan and tilt mount</title>
  <defs>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="mt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e8f0"/>
      <stop offset=".5" stop-color="#9aa0b4"/>
      <stop offset="1" stop-color="#d4d7e2"/>
    </linearGradient>
    <linearGradient id="bl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f86ff"/>
      <stop offset=".5" stop-color="#2f6fe0"/>
      <stop offset="1" stop-color="#1d4aa8"/>
    </linearGradient>
    <pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#15161f"/>
      <path d="M0 0H5M0 0V5" stroke="#7a8098" stroke-width="1"/>
    </pattern>
  </defs>
  <g>
    <title>Base plate</title>
    <polygon points="90,252 300,252 340,232 130,232" fill="#4b4e62" stroke="#8a8fa4"/>
    <rect x="90" y="252" width="210" height="22" rx="3" fill="#2f3140" stroke="#6a6e86" stroke-width="2"/>
    <rect x="118" y="259" width="34" height="8" rx="4" fill="#15161f"/>
    <rect x="238" y="259" width="34" height="8" rx="4" fill="#15161f"/>
  </g>
  <g>
    <title>Pan servo (lower): rotates the whole mount</title>
    <rect x="130" y="193.2" width="130" height="12" rx="2" fill="#1d4aa8" stroke="#143a86"/>
    <circle cx="140" cy="199.2" r="3" fill="#1f2138"/>
    <circle cx="250" cy="199.2" r="3" fill="#1f2138"/>
    <rect x="160" y="168" width="70" height="72" rx="4" fill="url(#bl)" stroke="#143a86" stroke-width="2"/>
    <rect x="166" y="212.64" width="58" height="18.72" rx="2" fill="#e8eaf5" opacity=".9"/>
    <path d="M166 176H224" stroke="#143a86" stroke-opacity=".45"/>
    <path d="M166 183H224" stroke="#143a86" stroke-opacity=".45"/>
    <path d="M166 190H224" stroke="#143a86" stroke-opacity=".45"/>
    <circle cx="195" cy="160" r="15" fill="#e8eaf5" stroke="#8a8fa4" stroke-width="2"/>
    <path d="M183 160H207M195 148V172" stroke="#c4c8d8" stroke-width="5"/>
    <circle cx="195" cy="160" r="4" fill="#8a8fa4"/>
  </g>
  <g>
    <title>Turntable</title>
    <rect x="150" y="136" width="90" height="12" rx="3" fill="#3a3c4a" stroke="#8a8fa4" stroke-width="2"/>
    <circle cx="170" cy="142" r="3" fill="#15161f"/>
    <circle cx="220" cy="142" r="3" fill="#15161f"/>
  </g>
  <g>
    <title>Bracket</title>
    <rect x="156" y="76" width="12" height="62" rx="2" fill="#3a3c4a" stroke="#8a8fa4" stroke-width="2"/>
    <rect x="222" y="76" width="12" height="62" rx="2" fill="#3a3c4a" stroke="#8a8fa4" stroke-width="2"/>
    <circle cx="162" cy="92" r="3" fill="#15161f"/>
    <circle cx="228" cy="92" r="3" fill="#15161f"/>
  </g>
  <g>
    <title>Tilt servo (upper): swings the sensor up and down</title>
    <rect x="142" y="85.1" width="108" height="12" rx="2" fill="#1d4aa8" stroke="#143a86"/>
    <circle cx="152" cy="91.1" r="3" fill="#1f2138"/>
    <circle cx="240" cy="91.1" r="3" fill="#1f2138"/>
    <rect x="172" y="62" width="48" height="66" rx="4" fill="url(#bl)" stroke="#143a86" stroke-width="2"/>
    <rect x="178" y="102.92" width="36" height="17.16" rx="2" fill="#e8eaf5" opacity=".9"/>
    <path d="M178 70H214" stroke="#143a86" stroke-opacity=".45"/>
    <path d="M178 77H214" stroke="#143a86" stroke-opacity=".45"/>
    <path d="M178 84H214" stroke="#143a86" stroke-opacity=".45"/>
  </g>
  <g>
    <title>Tilt horn</title>
    <circle cx="250" cy="96" r="13" fill="#e8eaf5" stroke="#8a8fa4" stroke-width="2"/>
    <path d="M240 96H260M250 86V106" stroke="#c4c8d8" stroke-width="5"/>
    <circle cx="250" cy="96" r="4" fill="#8a8fa4"/>
  </g>
  <g>
    <title>Sensor bracket: where the ultrasonic sensor attaches</title>
    <rect x="268" y="52" width="14" height="86" rx="2" fill="#3a3c4a" stroke="#8a8fa4" stroke-width="2"/>
    <circle cx="275" cy="64" r="3" fill="#15161f"/>
    <circle cx="275" cy="96" r="3" fill="#15161f"/>
    <circle cx="275" cy="126" r="3" fill="#15161f"/>
  </g>
  <g>
    <title>Servo wires (signal, power, ground) with connectors</title>
    <path d="M172 88C110 84 96 150 142 196" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>
    <path d="M172 88C110 84 96 150 142 196" fill="none" stroke="#f08a24" stroke-width="5" stroke-linecap="round"/>
    <path d="M172 95C110 91 96 157 142 203" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>
    <path d="M172 95C110 91 96 157 142 203" fill="none" stroke="#d3222a" stroke-width="5" stroke-linecap="round"/>
    <path d="M172 102C110 98 96 164 142 210" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>
    <path d="M172 102C110 98 96 164 142 210" fill="none" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/>
    <path d="M160 206C110 206 80 232.0 56 236.0" fill="none" stroke="#f08a24" stroke-width="5" stroke-linecap="round"/>
    <path d="M160 213C110 213 80 234.8 56 238.8" fill="none" stroke="#d3222a" stroke-width="5" stroke-linecap="round"/>
    <path d="M160 220C110 220 80 237.6 56 241.6" fill="none" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/>
    <rect x="30" y="226" width="30" height="34" rx="3" fill="#15161f" stroke="#555a73"/>
  </g>
</svg>