<svg style="color-scheme:dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <title>HC-SR04 ultrasonic sensor module</title>
<defs><linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
<linearGradient id="mt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6e8f0"/><stop offset=".5" stop-color="#9aa0b4"/><stop offset="1" stop-color="#d4d7e2"/></linearGradient>
<linearGradient id="bl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f86ff"/><stop offset=".5" stop-color="#2f6fe0"/><stop offset="1" stop-color="#1d4aa8"/></linearGradient>
<pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#15161f"/><path d="M0 0H5M0 0V5" stroke="#7a8098" stroke-width="1"/></pattern></defs><g><title>Pins: VCC, Trig, Echo, GND</title><rect x="200.5" y="214" width="7" height="68" fill="#d6b25e" stroke="#8a6a1f"/><rect x="224.5" y="214" width="7" height="68" fill="#d6b25e" stroke="#8a6a1f"/><rect x="248.5" y="214" width="7" height="68" fill="#d6b25e" stroke="#8a6a1f"/><rect x="272.5" y="214" width="7" height="68" fill="#d6b25e" stroke="#8a6a1f"/></g><rect x="40" y="40" width="400" height="184" rx="8" fill="#1d6fb8" stroke="#000" stroke-opacity=".35" stroke-width="2"><title>Sensor board</title></rect><rect x="40" y="40" width="400" height="184" rx="8" fill="url(#sh)"/><circle cx="62" cy="62" r="11" fill="#e8eaf5" stroke="#9aa0b8"/><circle cx="62" cy="62" r="6" fill="#1f2138"/><circle cx="418" cy="62" r="11" fill="#e8eaf5" stroke="#9aa0b8"/><circle cx="418" cy="62" r="6" fill="#1f2138"/><circle cx="62" cy="202" r="11" fill="#e8eaf5" stroke="#9aa0b8"/><circle cx="62" cy="202" r="6" fill="#1f2138"/><circle cx="418" cy="202" r="11" fill="#e8eaf5" stroke="#9aa0b8"/><circle cx="418" cy="202" r="6" fill="#1f2138"/>
