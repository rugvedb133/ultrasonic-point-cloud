<circle cx="155" cy="136" r="68" fill="#0d3a66" opacity=".35"/><circle cx="155" cy="136" r="63" fill="url(#mt)" stroke="#6b7088" stroke-width="2"/><circle cx="155" cy="136" r="53" fill="#2a2c3a" stroke="#555a73" stroke-width="2"/><circle cx="155" cy="136" r="46" fill="url(#mesh)"/><path d="M121 110a44 44 0 0 1 30 -22" stroke="#fff" stroke-opacity=".35" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  <g><title>Receiver: listens for the echo</title>
<circle cx="325" cy="136" r="68" fill="#0d3a66" opacity=".35"/><circle cx="325" cy="136" r="63" fill="url(#mt)" stroke="#6b7088" stroke-width="2"/><circle cx="325" cy="136" r="53" fill="#2a2c3a" stroke="#555a73" stroke-width="2"/><circle cx="325" cy="136" r="46" fill="url(#mesh)"/><path d="M291 110a44 44 0 0 1 30 -22" stroke="#fff" stroke-opacity=".35" stroke-width="4" fill="none" stroke-linecap="round"/></g><g><title>Crystal oscillator (Y1)</title><rect x="208" y="52" width="64" height="24" rx="12" fill="url(#mt)" stroke="#6b7088" stroke-width="2"/></g><text x="240" y="98" fill="#f2f4ff" font-family="sans-serif" font-size="10" font-weight="400" text-anchor="middle">Y1</text><text x="142" y="220" fill="#f2f4ff" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">HC-SR04</text><text x="76" y="216" fill="#f2f4ff" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="start">T</text><text x="404" y="216" fill="#f2f4ff" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="start">R</text><text x="204" y="190" fill="#f2f4ff" font-family="sans-serif" font-size="9" font-weight="400" text-anchor="middle">VCC</text><circle cx="204" cy="212" r="8" fill="#d6b25e" stroke="#8a6a1f"/><circle cx="204" cy="212" r="3" fill="#1f2138"/><text x="228" y="190" fill="#f2f4ff" font-family="sans-serif" font-size="9" font-weight="400" text-anchor="middle">Trig</text><circle cx="228" cy="212" r="8" fill="#d6b25e" stroke="#8a6a1f"/><circle cx="228" cy="212" r="3" fill="#1f2138"/><text x="252" y="190" fill="#f2f4ff" font-family="sans-serif" font-size="9" font-weight="400" text-anchor="middle">Echo</text><circle cx="252" cy="212" r="8" fill="#d6b25e" stroke="#8a6a1f"/><circle cx="252" cy="212" r="3" fill="#1f2138"/><text x="276" y="190" fill="#f2f4ff" font-family="sans-serif" font-size="9" font-weight="400" text-anchor="middle">GND</text><circle cx="276" cy="212" r="8" fill="#d6b25e" stroke="#8a6a1f"/><circle cx="276" cy="212" r="3" fil