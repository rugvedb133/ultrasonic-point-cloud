<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" width="240" height="150" xmlns:c2pa="http://c2pa.org/manifest">
  <title>HC-SR04 ultrasonic sensor module</title>
  <defs><pattern id="mesh" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#1c1d2a"/><path d="M0 0H4M0 0V4" stroke="#6b7088" stroke-width=".8"/></pattern></defs>
  <g fill="#d6b25e"><title>Pins: VCC, Trig, Echo, GND</title>
    <rect x="102" y="112" width="4" height="26"/><rect x="113" y="112" width="4" height="26"/><rect x="124" y="112" width="4" height="26"/><rect x="135" y="112" width="4" height="26"/></g>
  <rect x="20" y="20" width="200" height="92" rx="4" fill="#1d6fb8" stroke="#0f4c82" stroke-width="2"><title>Sensor board</title></rect>
  <g fill="#e8eaf5" stroke="#0f4c82"><circle cx="30" cy="30" r="3.5"/><circle cx="210" cy="30" r="3.5"/><circle cx="30" cy="102" r="3.5"/><circle cx="210" cy="102" r="3.5"/></g>
  <g><title>Transmitter: sends the ultrasonic pulse</title>
    <circle cx="78" cy="68" r="35" fill="#aeb3c2" stroke="#7d8397" stroke-width="2"/><circle cx="78" cy="68" r="28" fill="#2a2c3a"/><circle cx="78" cy="68" r="23" fill="url(#mesh)"/></g>
  <g><title>Receiver: listens for the echo</title>
    <circle cx="162" cy="68" r="35" fill="#aeb3c2" stroke="#7d8397" stroke-width="2"/><circle cx="162" cy="68" r="28" fill="#2a2c3a"/><circle cx="162" cy="68" r="23" fill="url(#mesh)"/></g>
  <rect x="108" y="27" width="24" height="11" rx="5" fill="#c9ccd6" stroke="#8a8fa4"><title>Crystal oscillator</title></rect>
  <text x="120" y="104" fill="#e8eaf5" font-family="sans-serif" font-size="8" text-anchor="middle">HC-SR04</text>
</svg>
