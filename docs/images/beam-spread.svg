<svg xmlns="http://www.w3.org/2000/svg" style="color-scheme:dark" viewBox="0 0 800 300" width="800" height="300" xmlns:c2pa="http://c2pa.org/manifest">
<style>:not(svg):has(> title){ cursor:help }</style>
<title>Beam spread of the HC-SR04, drawn to scale from above</title>
<desc>A 15 degree cone leaves the sensor and widens to about 26 cm at 1 m, 53 cm at 2 m and 105 cm at 4 m.</desc>
<g>
<text x="86" y="142" font-size="18" fill="#f2f4ff" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif">15°</text>
    <title>The 15° beam</title>
<polygon points="60,150 740,60.5 740,239.5" fill="#4a9be0" fill-opacity=".2" stroke="#4a9be0" stroke-width="2">
</polygon>
</g>
<path d="M60 150H740" stroke="#b4b9d8" stroke-dasharray="6 6" stroke-opacity=".6"/>
<g>
<title>At 1 m the beam is about 26 cm wide</title>
<path d="M230 127.6V172.4" stroke="#f08a24" stroke-width="4" stroke-linecap="round"/>
<text x="230" y="198" text-anchor="middle" font-size="18" fill="#f2f4ff" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif">26 cm wide</text>
<text x="230" y="114" text-anchor="middle" font-size="16" fill="#b4b9d8" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif">1 m</text>
</g>
<g>
<title>At 2 m the beam is about 53 cm wide</title>
<path d="M400 105.2V194.8" stroke="#f08a24" stroke-width="4" stroke-linecap="round"/>
<text x="400" y="221" text-anchor="middle" font-size="18" fill="#f2f4ff" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif">53 cm wide</text>
<text x="400" y="91" text-anchor="middle" font-size="16" fill="#b4b9d8" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif">2 m</text>
</g>
<g>
<title>At 4 m the beam is about 105 cm wide</title>
<path d="M740 60.5V239.5" stroke="#f08a24" stroke-width="4" stroke-linecap="round"/>
<text x="740" y="266" text-anchor="middle" font-size="18" fill="#f2f4ff" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif">105 cm wide</text>
<text x="740" y="46" text-anchor="middle" font-size="16" fill="#b4b9d8" font-family="Atkinson Hyperlegible, Segoe UI, sans-serif">4 m</text>
</g>
<g>
<title>HC-SR04 sensor</title>
<rect x="26" y="128" width="36" height="44" rx="4" fill="#1d6fb8" stroke="#4a9be0" stroke-width="2"/>
</g>
</svg>